<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ELK AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
    }

    a-scene {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .a-enter-vr {
      display: none !important;
    }
  </style>

</head>


<body>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: true;
      uiScanning: true;
      uiError: true;
    "
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true;"
  >

    <!-- MODEL -->
    <a-assets>

      <a-asset-item
        id="elkAsset"
        src="./elk.glb">
      </a-asset-item>

    </a-assets>


    <!-- CAMERA -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- TARGET -->
    <a-entity
      id="elkTarget"
      mindar-image-target="targetIndex: 0"
    >

      <a-gltf-model
        id="elk"
        src="#elkAsset"
        position="0 0 0"
        rotation="0 0 0"
        scale="1 1 1">
      </a-gltf-model>

    </a-entity>

  </a-scene>


  <script>

    const target = document.querySelector("#elkTarget");

    target.addEventListener("targetFound", () => {

      console.log("TARGET FOUND");

      setTimeout(() => {

        const model = document.querySelector("#elk");

        // Animation will be added later

        console.log("ELK READY");

      }, 1000);

    });

    target.addEventListener("targetLost", () => {

      console.log("TARGET LOST");

    });

  </script>

</body>

</html>
