<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ELK AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- A-Frame Extras: animation-mixer -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
    }

    a-scene {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .a-enter-vr {
      display: none !important;
    }
  </style>
</head>


<body>

  <a-scene
    id="scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: true;
      uiScanning: true;
      uiError: true;
    "

    embedded

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- =====================================
         CAMERA
    ====================================== -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>



    <!-- =====================================
         LIGHTING
    ====================================== -->

    <a-entity
      light="
        type: ambient;
        intensity: 1.5;
      ">
    </a-entity>


    <a-entity
      light="
        type: directional;
        intensity: 1;
      "
      position="1 2 1">
    </a-entity>



    <!-- =====================================
         IMAGE TARGET
    ====================================== -->

    <a-entity
      id="elkTarget"
      mindar-image-target="targetIndex: 0"
    >


      <!-- =================================
           ELK MODEL
      ================================== -->

      <a-entity
        id="elk"

        gltf-model="url(./elkfin.glb)"

        position="0.5 -0.5 0.5"

        rotation="90 0 0"

        scale="0.8 0.8 0.8"

        visible="true">
      </a-entity>


    </a-entity>

  </a-scene>



  <script>

    const scene = document.querySelector("#scene");
    const target = document.querySelector("#elkTarget");
    const elk = document.querySelector("#elk");

    let modelLoaded = false;


    // =====================================
    // SCENE LOADED
    // =====================================

    scene.addEventListener("loaded", () => {

      console.log("✅ A-FRAME SCENE READY");

    });



    // =====================================
    // GLB LOADED
    // =====================================

    elk.addEventListener("model-loaded", () => {

      console.log("✅ ELK GLB LOADED");

      modelLoaded = true;


      const object = elk.getObject3D("mesh");

      if (!object) {

        console.error("❌ NO ELK MESH FOUND");

        return;

      }


      // -------------------------------------
      // Disable frustum culling
      // Useful for animated / skinned meshes
      // -------------------------------------

      object.traverse((node) => {

        if (node.isMesh || node.isSkinnedMesh) {

          node.frustumCulled = false;

        }


        // -----------------------------------
        // Force double-sided materials
        // Useful during AR debugging
        // -----------------------------------

        if (node.material) {

          const materials = Array.isArray(node.material)
            ? node.material
            : [node.material];


          materials.forEach((material) => {

            material.side = THREE.DoubleSide;
            material.needsUpdate = true;

          });

        }

      });


      console.log("✅ ELK MESH READY");

    });



    // =====================================
    // MODEL ERROR
    // =====================================

    elk.addEventListener("model-error", (event) => {

      console.error(
        "❌ ELK GLB LOAD ERROR:",
        event
      );

    });



    // =====================================
    // TARGET FOUND
    // =====================================

    target.addEventListener("targetFound", () => {

      console.log("✅ TARGET FOUND");


      if (!modelLoaded) {

        console.log("⏳ Waiting for model...");

        return;

      }


      /*
        Remove animation-mixer first.

        This guarantees that when the target
        is found again, the animation starts
        again from frame 0.
      */

      elk.removeAttribute("animation-mixer");


      requestAnimationFrame(() => {

        elk.setAttribute(
          "animation-mixer",

          {
            clip: "*",
            loop: "repeat",
            repetitions: Infinity,
            timeScale: 1
          }

        );


        console.log(
          "▶ ELK ANIMATION STARTED"
        );

      });

    });



    // =====================================
    // TARGET LOST
    // =====================================

    target.addEventListener("targetLost", () => {

      console.log("⚠️ TARGET LOST");


      /*
        Stop animation while the marker
        is not being tracked.
      */

      elk.removeAttribute(
        "animation-mixer"
      );


      console.log(
        "⏹ ELK ANIMATION STOPPED"
      );

    });

  </script>

</body>

</html>
