<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ELK AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
    }

    a-scene {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .a-enter-vr {
      display: none !important;
    }
  </style>
</head>


<body>

  <a-scene
    id="scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: true;
      uiScanning: true;
      uiError: true;
    "

    embedded

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- =========================
         CAMERA
    ========================== -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>



    <!-- =========================
         LIGHTS
    ========================== -->

    <a-entity
      light="
        type: ambient;
        intensity: 1.5;
      ">
    </a-entity>


    <a-entity
      light="
        type: directional;
        intensity: 1;
      "
      position="1 2 1">
    </a-entity>



    <!-- =========================
         IMAGE TARGET
    ========================== -->

    <a-entity
      id="Target"
      mindar-image-target="targetIndex: 0"
    >


      <!-- =========================
           3D MODEL
      ========================== -->

      <a-entity
        id=""

        gltf-model="url(./elk.glb)"

        position="0 0 0"

        rotation="0 0 0"

        scale="0.01 0.01 0.01">
      </a-entity>


    </a-entity>

  </a-scene>



  <script>

    const scene = document.querySelector("#scene");
    const target = document.querySelector("#elkTarget");
    const model = document.querySelector("#elk");


    // =========================
    // SCENE READY
    // =========================

    scene.addEventListener("loaded", () => {

      console.log("A-FRAME SCENE READY");

    });



    // =========================
    // MODEL LOADED
    // =========================

    model.addEventListener("model-loaded", () => {

      console.log("MODEL LOADED");

    });



    // =========================
    // MODEL ERROR
    // =========================

    model.addEventListener("model-error", (event) => {

      console.error("MODEL LOAD ERROR:", event);

    });



    // =========================
    // TARGET FOUND
    // =========================

    target.addEventListener("targetFound", () => {

      console.log("TARGET FOUND");

      model.setAttribute("visible", true);

    });



    // =========================
    // TARGET LOST
    // =========================

    target.addEventListener("targetLost", () => {

      console.log("TARGET LOST");

    });

  </script>

</body>

</html>
