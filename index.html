<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ELK AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- A-Frame Extras: animation-mixer -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.1/dist/aframe-extras.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    /* Hide A-Frame VR button */
    .a-enter-vr {
      display: none !important;
    }
  </style>

</head>


<body>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "

    embedded

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- =========================
         ASSETS
    ========================== -->

    <a-assets>

      <a-asset-item
        id="elkModelAsset"
        src="./elk.glb">
      </a-asset-item>

    </a-assets>


    <!-- =========================
         CAMERA
    ========================== -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- =========================
         IMAGE TARGET
         targets.mind target #0
    ========================== -->

    <a-entity
      id="elkTarget"
      mindar-image-target="targetIndex: 0"
    >

      <a-gltf-model
        id="elkModel"
        src="#elkModelAsset"

        position="0 0 0.1"

        rotation="0 0 0"

        scale="1 1 1"

        animation-mixer="
          clip: *;
          loop: repeat;
          autoplay: false;
        "
      >
      </a-gltf-model>

    </a-entity>


  </a-scene>


  <!-- =========================
       AR LOGIC
  ========================== -->

  <script>

    const target = document.querySelector("#elkTarget");
    const model = document.querySelector("#elkModel");

    let animationTimer = null;


    // Target detected
    target.addEventListener("targetFound", () => {

      console.log("ELK target found");

      // Clear previous timer
      clearTimeout(animationTimer);

      // Wait 1 second before starting animation
      animationTimer = setTimeout(() => {

        console.log("Starting ELK animation");

        model.setAttribute(
          "animation-mixer",
          "clip: *; loop: repeat; autoplay: true;"
        );

      }, 1000);

    });


    // Target lost
    target.addEventListener("targetLost", () => {

      console.log("ELK target lost");

      clearTimeout(animationTimer);

      // Stop animation
      model.setAttribute(
        "animation-mixer",
        "clip: *; loop: repeat; autoplay: false;"
      );

    });

  </script>

</body>

</html>
