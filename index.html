<a-assets>
  <a-asset-item
    id="elkModelAsset"
    src="./elk.glb">
  </a-asset-item>
</a-assets>

<a-camera
  position="0 0 0"
  look-controls="enabled: false">
</a-camera>

<a-entity mindar-image-target="targetIndex: 0">

  <a-gltf-model
    id="elkModel"
    src="#elkModelAsset"
    position="0 0 0.1"
    rotation="0 0 0"
    scale="1 1 1"
    animation-mixer="clip: *; loop: repeat; autoplay: false;">
  </a-gltf-model>

</a-entity>
